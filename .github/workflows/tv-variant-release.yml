# PiliPlus TV 4K, the video plane variant (docs/tv/4K_VARIANT.md). Lives only on
# variant/4k-passthrough and never on main.
#
# This branch doesn't follow upstream by itself: someone merges main into it,
# checks it on a TV and pushes. A push builds and runs the TV checks; only a
# v*-4k tag publishes. Releases go to a separate repository, because the normal
# app's updater offers the newest release of its own repository, whatever it is.
name: Build and release PiliPlus TV 4K

on:
  push:
    branches:
      - variant/4k-passthrough
    tags:
      - "v*-4k"

concurrency:
  group: tv-variant-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_REPO: liweichen6/PiliPlus-LemonTeaV-4K

jobs:
  checks:
    name: TV checks
    uses: ./.github/workflows/tv-checks.yml
    with:
      ref: ${{ github.sha }}

  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit being released
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply project Flutter & TV patches
        shell: pwsh
        run: lib/scripts/patch.ps1 android

      - name: Prepare build metadata
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Restore signing key from secrets
        shell: bash
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGN_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing secrets are missing. Building without them produces a random signature and every update conflicts with the installed app."
            exit 1
          fi
          printf '%s' "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          printf 'storeFile=key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: Build release APKs
        shell: bash
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --no-pub

      - name: Upload Android APKs
        uses: actions/upload-artifact@v7
        with:
          name: PiliPlus-4K-Android-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  release:
    name: Publish PiliPlus TV 4K
    needs: [checks, android]
    # A red TV check blocks the release even when the APKs built.
    if: ${{ startsWith(github.ref, 'refs/tags/') && !cancelled() && needs.checks.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit being released
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Refuse a tag that isn't on the variant branch
        shell: bash
        run: |
          git fetch --no-tags https://github.com/${{ github.repository }}.git variant/4k-passthrough
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

      - name: Download app artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      # The updater compares the release's commit with the build's, so the
      # commit has to exist in the release repository.
      - name: Publish source and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VARIANT_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "VARIANT_REPO_TOKEN is not set (docs/tv/4K_VARIANT.md)." >&2
            exit 1
          fi
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPO}.git" \
            "${GITHUB_SHA}:refs/heads/main" \
            "${GITHUB_SHA}:refs/tags/${GITHUB_REF_NAME}"

          {
            echo "PiliPlus TV 4K ${GITHUB_REF_NAME#v}: 4K on the TV's video plane."
            echo
            echo "Installs beside the normal app, with its own data."
            echo "Source: https://github.com/${RELEASE_REPO}/commit/${GITHUB_SHA}"
            echo "Notes: https://github.com/${RELEASE_REPO}/blob/${GITHUB_SHA}/docs/tv/4K_VARIANT.md"
            echo
            echo "Checks passed: TV analyze and tests."
          } > "$RUNNER_TEMP/release-notes.md"

          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$RELEASE_REPO" \
            --verify-tag \
            --title "PiliPlus TV 4K ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
